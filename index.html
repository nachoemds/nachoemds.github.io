<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Cómo te sentís? — Gauchito Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Caveat:wght@600;700&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sunset-1:#FF5A36;
    --sunset-2:#C21858;
    --ink:#23122B;
    --paper:#FFF6E7;
    --paper-dim:#8A756E;
    --cream-dim: rgba(255,246,231,0.72);
    --yellow:#FFC93C;
    --green:#00B37E;
    --pink:#FF3D7F;
    --violet:#8E6BFF;
    --line: rgba(35,18,43,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--sunset-2);
    color:var(--paper);
    font-family:'Space Grotesk', sans-serif;
    min-height:100vh;
    text-align: center;
    display:flex;
    justify-content:center;
    padding: 32px 16px 60px;
    position:relative;
    overflow-x:hidden;
  }

  /* --- Fondo: video oficial de Gauchito Club + overlay para legibilidad --- */
  .bg-video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:0;
  }
  .bg-overlay{
    position:fixed;
    inset:0;
    z-index:1;
    background:
      radial-gradient(circle, rgba(35,18,43,0.28) 1px, transparent 1.4px) 0 0/14px 14px,
      linear-gradient(155deg, rgba(255,90,54,0.62) 0%, rgba(194,24,88,0.68) 65%, rgba(110,23,80,0.76) 100%);
  }
  .wrap{ width:100%; max-width:480px; position:relative; z-index:2; }

  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--ink);
    background:var(--paper);
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:6px 12px 6px 10px;
    border-radius:100px;
    border:2px dashed var(--ink);
    transform:rotate(-2deg);
    margin-bottom:22px;
  }
  .eyebrow::before{
    content:"";
    width:7px;height:7px;border-radius:50%;
    background:var(--pink);
  }

  .logo{
    width:120px;
    height:auto;
    display:block;
    margin: 0 auto;
    margin-bottom:18px;
    filter: drop-shadow(3px 3px 0 rgba(35,18,43,0.4));
  }

  h1{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:clamp(38px, 11vw, 56px);
    line-height:1.05;
    margin:0 0 6px;
    letter-spacing:0.01em;
    text-shadow: 2px 2px 0 rgba(35,18,43,0.4);
  }
  h1 span{ color:var(--yellow); }
  .sub{
    color:var(--cream-dim);
    font-size:15px;
    line-height:1.5;
    margin:0 auto 26px;
    max-width:40ch;
  }

  /* --- Signature: ticket-stub tuner / EQ (chico, va debajo del botón) --- */
  .tuner{
    position:relative;
    height:30px;
    border:2px solid var(--ink);
    border-radius:9px;
    background:var(--paper);
    box-shadow:3px 3px 0 rgba(35,18,43,0.55);
    display:flex;
    align-items:flex-end;
    gap:3px;
    padding:6px 9px;
    margin:22px 0 0;
    overflow:hidden;
  }
  .tuner .bar{
    flex:1;
    background:linear-gradient(180deg, var(--yellow), var(--pink));
    border-radius:1.5px;
    height:20%;
    animation: eq 1.1s ease-in-out infinite;
    opacity:0.95;
  }
  .tuner .bar:nth-child(1){animation-delay:-0.1s}
  .tuner .bar:nth-child(2){animation-delay:-0.5s}
  .tuner .bar:nth-child(3){animation-delay:-0.2s}
  .tuner .bar:nth-child(4){animation-delay:-0.8s}
  .tuner .bar:nth-child(5){animation-delay:-0.35s}
  .tuner .bar:nth-child(6){animation-delay:-0.6s}
  .tuner .bar:nth-child(7){animation-delay:-0.15s}
  .tuner .bar:nth-child(8){animation-delay:-0.45s}
  .tuner .bar:nth-child(9){animation-delay:-0.7s}
  .tuner .bar:nth-child(10){animation-delay:-0.25s}
  .tuner .bar:nth-child(11){animation-delay:-0.55s}
  .tuner .bar:nth-child(12){animation-delay:-0.05s}
  @keyframes eq{
    0%,100%{height:15%;}
    50%{height:85%;}
  }
  @media (prefers-reduced-motion: reduce){
    .tuner .bar{ animation:none; height:55%; }
  }

  /* --- Mini player "sonando ahora" (home) --- */
  .now-playing{
    margin-top:26px;
  }
  .now-playing .label{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:11.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--cream-dim);
    margin-bottom:8px;
  }
  .now-playing .embed-mini{
    border-radius:12px;
    overflow:hidden;
    border:3px solid var(--ink);
    box-shadow:4px 4px 0 rgba(35,18,43,0.55);
  }
  .now-playing .embed-mini iframe{ display:block; width:100%; border:none; }

  /* --- Question form --- */
  form{ margin-bottom:18px; }
  textarea{
    width:100%;
    resize:none;
    background:var(--paper);
    border:3px solid var(--ink);
    border-radius:14px;
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    font-size:16px;
    padding:16px;
    min-height:96px;
    line-height:1.4;
    box-shadow:5px 5px 0 rgba(35,18,43,0.55);
    transition: box-shadow .12s ease, transform .12s ease;
  }
  textarea:focus{
    outline:none;
    box-shadow:2px 2px 0 rgba(35,18,43,0.55);
    transform:translate(3px,3px);
  }
  textarea::placeholder{ color:var(--paper-dim); }

  .chips{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:9px;
    margin:16px 0 22px;
  }
  .chip{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:12.5px;
    padding:8px 13px;
    border-radius:100px;
    border:2px solid var(--ink);
    background:var(--paper);
    color:var(--ink);
    cursor:pointer;
    transition: all .12s ease;
  }
  .chip:hover, .chip:focus-visible{ background:var(--yellow); outline:none; }
  .chip:active{ transform:scale(0.96); }

  button.submit{
    width:100%;
    font-family:'Bungee', sans-serif;
    font-weight:400;
    font-size:16px;
    letter-spacing:0.01em;
    background:var(--yellow);
    color:var(--ink);
    border:3px solid var(--ink);
    border-radius:14px;
    padding:16px;
    cursor:pointer;
    box-shadow:5px 5px 0 rgba(35,18,43,0.55);
    transition: all .12s ease;
  }
  button.submit:hover{ background:var(--pink); color:var(--paper); }
  button.submit:active{ box-shadow:2px 2px 0 rgba(35,18,43,0.55); transform:translate(3px,3px); }
  button.submit:focus-visible{ outline:2px solid var(--paper); outline-offset:2px; }

  /* --- Result card (flyer sticker) --- */
  .result{ display:none; --accent: var(--yellow); }
  .result.show{ display:block; animation: rise .35s ease; }
  @keyframes rise{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }

  .match-line{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    font-weight:600;
    color:var(--paper);
    text-transform:uppercase;
    letter-spacing:0.08em;
    margin-bottom:12px;
  }

  .card{
    background:var(--paper);
    border:3px solid var(--ink);
    border-radius:18px;
    padding:22px 20px 20px;
    margin-bottom:18px;
    transform:rotate(-1deg);
    box-shadow:6px 6px 0 rgba(35,18,43,0.55);
  }
  .card .tag{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:11px;
    color:var(--ink);
    background:var(--accent);
    padding:5px 11px;
    border-radius:100px;
    border:2px solid var(--ink);
    transform:rotate(-3deg);
    margin-bottom:14px;
  }
  .card h2{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:34px;
    line-height:1.15;
    color:var(--ink);
    margin:0 0 10px;
    display:inline;
    background-image: linear-gradient(var(--accent), var(--accent));
    background-repeat:no-repeat;
    background-size:100% 30%;
    background-position:0 85%;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }
  .card .why{
    color:var(--paper-dim);
    font-size:14px;
    line-height:1.5;
    margin:14px 0 16px;
  }
  .embed-wrap{
    border-radius:14px;
    overflow:hidden;
    border:3px solid var(--ink);
  }
  .embed-wrap iframe{ display:block; width:100%; border:none; }

  .actions{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin-top:16px;
  }
  .actions button, .actions a{
    flex:1;
    min-width:120px;
    text-align:center;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:14px;
    padding:12px 14px;
    border-radius:12px;
    border:2px solid var(--ink);
    background:var(--paper);
    color:var(--ink);
    cursor:pointer;
    text-decoration:none;
    box-shadow:3px 3px 0 rgba(35,18,43,0.55);
    transition: all .12s ease;
  }
  .actions button:hover, .actions a:hover{ background:var(--green); color:var(--paper); }
  .actions button:active, .actions a:active{ box-shadow:1px 1px 0 rgba(35,18,43,0.55); transform:translate(2px,2px); }

  .retry{
    display:block;
    text-align:center;
    width:100%;
    background:none;
    border:none;
    color:var(--cream-dim);
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    padding:14px 0 0;
    cursor:pointer;
    text-decoration:underline;
    text-underline-offset:3px;
  }
  .retry:hover{ color:var(--paper); }

  .toast{
    position:fixed;
    left:50%; bottom:24px;
    transform:translateX(-50%) translateY(20px);
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:12.5px;
    padding:10px 16px;
    border-radius:100px;
    border:2px solid var(--ink);
    box-shadow:3px 3px 0 rgba(35,18,43,0.55);
    opacity:0;
    transition: all .25s ease;
    pointer-events:none;
    white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  footer{
    margin-top:36px;
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--cream-dim);
    opacity:0.75;
  }
  footer .credit{ margin-bottom:10px; }
  footer .official-links{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
  }
  footer .official-links a{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:11.5px;
    color:var(--ink);
    background:var(--paper);
    text-decoration:none;
    padding:7px 12px;
    border-radius:100px;
    border:2px solid var(--ink);
    opacity:1;
    transition: all .12s ease;
  }
  footer .official-links a:hover{ background:var(--yellow); }

  #songTitle {
    display: block;
    max-width: 60%;
    margin: 0 auto;
    text-align: center;
  }

</style>
</head>

const CHIP_KEYS = ['feliz','triste','enamorado','bailar','nostalgia','relax','bronca','libre'];

// Color de acento por estado de ánimo (sticker del tag + highlighter del título)
const MOOD_COLORS = {
  feliz:'#FFC93C', bailar:'#FF3D7F', enamorado:'#FF5A36', pasion:'#E8145B',
  triste:'#8E6BFF', ansioso:'#8E6BFF', bronca:'#FF5A36', nostalgia:'#FFC93C',
  libre:'#00B37E', prendido:'#FF3D7F', solo:'#8E6BFF', relax:'#00B37E'
};

function stripAccents(s){
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

function pickMood(text){
  const norm = stripAccents(text.toLowerCase());
  let best = null, bestScore = 0;
  for(const m of MOODS){
    let score = 0;
    for(const k of m.kw){
      if(norm.includes(stripAccents(k))) score++;
    }
    if(score > bestScore){ bestScore = score; best = m; }
  }
  if(best) return best;
  // sin match: sorpresa aleatoria
  return MOODS[Math.floor(Math.random()*MOODS.length)];
}

function moodByKey(key){ return MOODS.find(m => m.key === key); }
function songById(id){
  for(const m of MOODS){
    const s = m.songs.find(s => s.id === id);
    if(s) return { mood:m, song:s };
  }
  return null;
}
function randomSong(mood){
  return mood.songs[Math.floor(Math.random()*mood.songs.length)];
}

function renderChips(){
  const wrap = document.getElementById('chips');
  wrap.innerHTML = '';
  CHIP_KEYS.forEach(key=>{
    const m = moodByKey(key);
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.textContent = m.label;
    b.addEventListener('click', ()=> showResult(m, randomSong(m), false));
    wrap.appendChild(b);
  });
}

function showResult(mood, song, matched){
  document.getElementById('questionScreen').style.display = 'none';
  const r = document.getElementById('resultScreen');
  r.classList.add('show');

  document.getElementById('matchLine').textContent = matched===false ? 'elegiste' : (matched ? 'según lo que me contaste' : 'no te agarré del todo, pero probá esto');
  document.getElementById('resultScreen').style.setProperty('--accent', MOOD_COLORS[mood.key] || '#FFC93C');
  document.getElementById('moodTag').textContent = mood.label;
  document.getElementById('songTitle').textContent = song.title;
  document.getElementById('songWhy').textContent = mood.why;
  document.getElementById('spotifyEmbed').src = `https://open.spotify.com/embed/track/${song.id}?utm_source=generator&theme=0&go=1`;

  const url = new URL(window.location.href);
  url.search = '';
  url.searchParams.set('song', song.id);
  window.history.replaceState({}, '', url);
  window.__shareUrl = url.toString();
  window.__shareMood = mood;
  window.__shareSong = song;
}

document.getElementById('moodForm').addEventListener('submit', (e)=>{
  e.preventDefault();
  const text = document.getElementById('moodInput').value.trim();
  if(!text){ document.getElementById('moodInput').focus(); return; }
  const mood = pickMood(text);
  const norm = stripAccents(text.toLowerCase());
  const matched = mood.kw.some(k => norm.includes(stripAccents(k)));
  showResult(mood, randomSong(mood), matched);
});

document.getElementById('retryBtn').addEventListener('click', ()=>{
  document.getElementById('resultScreen').classList.remove('show');
  document.getElementById('questionScreen').style.display = 'block';
  document.getElementById('moodInput').value = '';
  const url = new URL(window.location.href);
  url.search = '';
  window.history.replaceState({}, '', url);
});

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 1800);
}

document.getElementById('shareBtn').addEventListener('click', async ()=>{
  const mood = window.__shareMood;
  const song = window.__shareSong;
  const shareData = {
    title: 'Gauchito Club — sintonía',
    text: `Me sentía "${mood.label.toLowerCase()}" y me tocó "${song.title}" de Gauchito Club. Probá vos también:`,
    url: window.__shareUrl
  };
  if(navigator.share){
    try{ await navigator.share(shareData); }catch(e){ /* cancelado, ignorar */ }
  } else {
    try{
      await navigator.clipboard.writeText(`${shareData.text} ${shareData.url}`);
      showToast('Copiado, pegalo donde quieras ✓');
    }catch(e){ showToast('No se pudo compartir'); }
  }
});

document.getElementById('copyBtn').addEventListener('click', async ()=>{
  try{
    await navigator.clipboard.writeText(window.__shareUrl);
    showToast('Link copiado ✓');
  }catch(e){ showToast('No se pudo copiar'); }
});

renderChips();

// Nota: los navegadores bloquean el audio con volumen sin interacción previa del usuario,
// así que queda pre-cargado y solo hace falta un toque en play.
(function initHomePreview(){
  const allSongs = MOODS.flatMap(m => m.songs);
  const pick = allSongs[Math.floor(Math.random()*allSongs.length)];
  const homeEmbed = document.getElementById('homePreview');
  if(homeEmbed){
    homeEmbed.src = `https://open.spotify.com/embed/track/${pick.id}?utm_source=generator&theme=0`;
  }
})();

const params = new URLSearchParams(window.location.search);
const sharedId = params.get('song');
if(sharedId){
  const found = songById(sharedId);
  if(found) showResult(found.mood, found.song, undefined);
}
